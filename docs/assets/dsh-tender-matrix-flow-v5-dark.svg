<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">dsh-tender-matrix structure: one scoring matrix, seven rule locators, two exits</title>
<desc id="figDesc">The material (file or material, JSON or YAML) is parsed into a header plus rows. The scoring matrix is the object under audit: TM-001 reads the project and method header, TM-006 reads seq, TM-003 reads the maxScore column, TM-002 compares bidderA with maxScore, TM-004 reads the bidderA column, and TM-005 plus TM-007 read the basis column. On the real TM-002 fixture, TM-002 fires on row 1 with 32 greater than 30, while TM-003 and TM-004 are skipped because target is 0. Two exits: issues[] and skipped[]. The report passes no compliance verdict.</desc>
